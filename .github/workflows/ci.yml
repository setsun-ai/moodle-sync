# Runs on every pull request and every push to main: lint + tests on Windows, macOS and Linux.
# No secrets are used - the tests never talk to a real Moodle or send notifications.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual run from the Actions tab, e.g. for a branch without a PR

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; the oldest and newest on Windows and macOS.
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: CLI starts
        run: python -m moodle_sync --help

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts parse and pass shellcheck (errors only)
        run: |
          for f in install.sh sync.sh deploy/linux/*.sh deploy/macos/*.sh; do
            bash -n "$f"
            shellcheck -S error "$f"
          done
      - name: Windows scripts keep CRLF line endings
        run: |
          for f in *.bat deploy/windows/*; do
            grep -q $'\r' "$f" || { echo "$f has LF line endings"; exit 1; }
          done
